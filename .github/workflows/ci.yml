# CI: runs on every pull request and every push to dev/main.
# Goal: never merge something that breaks the tests or the Docker build.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest ruff

      - name: Lint (ruff)
        run: |
          if git ls-files '*.py' | grep -q .; then ruff check .; else echo "No Python file yet, lint skipped."; fi

      - name: Tests (pytest)
        run: |
          set +e
          pytest -q
          rc=$?
          # pytest exits with 5 when no test is collected: fine while the project starts.
          if [ $rc -eq 5 ]; then echo "No test yet."; exit 0; fi
          exit $rc

  docker:
    name: docker build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (only once a Dockerfile exists)
        run: |
          if [ ! -f Dockerfile ]; then echo "No Dockerfile yet, build skipped."; exit 0; fi
          docker build -t place-publique:ci .
